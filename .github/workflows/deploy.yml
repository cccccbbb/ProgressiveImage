name: Deploy to GitHub Pages

# 推 main 就重新构建并发布；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署需要的权限：读代码 + 写 Pages + 用 OIDC 拿部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 注意：npm run build 会自动先跑 prebuild → gen:photos，
      # 在 runner 上访问 picsum 生成 thumbhash（失败会回退到已提交的 photos.json）。
      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库里 Pages 从未启用过时，尝试由工作流自动开启，
          # 省掉「手动去 Settings → Pages 选 GitHub Actions」这一步。
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
